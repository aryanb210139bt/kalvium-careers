<!doctype html>
<html><head><meta charset="utf-8">
<!-- Kalvium hiring poster, 1200x630. Placeholders: {{assets}} {{headline}} {{subhead}} {{title}} {{subtitle}} {{location}} {{work_mode}} {{experience}} {{ctc}} {{employment}} {{footer}} -->
<style>
@font-face{font-family:Bebas;src:url({{assets}}/fonts/bebas-latin.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:100 900;src:url({{assets}}/fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+2212}
@font-face{font-family:Inter;font-weight:100 900;src:url({{assets}}/fonts/inter-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+20A0-20C4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0A0A0C}
body{font-family:Inter,system-ui,sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:
  radial-gradient(620px 520px at 930px 300px,rgba(242,35,42,.42),transparent 70%),
  radial-gradient(500px 300px at 0 0,rgba(242,35,42,.14),transparent 70%),
  linear-gradient(180deg,#0E0E11,#0A0A0C)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(520px 420px at 930px 300px,#000,transparent 75%)}
.mark{position:absolute;right:58px;top:88px;height:450px;filter:drop-shadow(0 0 60px rgba(242,35,42,.45))}
.ring{position:absolute;right:20px;top:14px;width:600px;height:600px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.ring.r2{right:90px;top:84px;width:460px;height:460px;border-color:rgba(242,35,42,.22)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0A0A0C 0,#0A0A0C 46%,rgba(10,10,12,.55) 62%,rgba(10,10,12,0) 78%)}
.col{position:absolute;left:64px;top:50px;width:700px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px;letter-spacing:-.3px}
.brand img{height:38px}
.brand .sep{width:1px;height:24px;background:rgba(255,255,255,.3);margin:0 4px}
.brand .c{font-weight:500;font-size:17px;letter-spacing:3px;text-transform:uppercase;color:#C9C9CF}
h1{font-family:Bebas,Impact,sans-serif;font-weight:400;font-size:118px;line-height:.86;letter-spacing:1px;margin-top:30px}
h1 b{color:#F2232A;font-weight:400}
.sub{font-size:25px;color:#D6D6DB;margin-top:10px;font-weight:500}
.role{margin-top:30px;padding-left:18px;border-left:4px solid #F2232A}
.title{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.8px;max-width:660px}
.subtitle{font-size:22px;font-weight:600;color:#FF5A5F;margin-top:6px}
.subtitle:empty{display:none}
.chips{display:flex;gap:12px;margin-top:28px}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 18px 12px}
.chip .k{font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9A9AA3;font-weight:600}
.chip .v{font-size:21px;font-weight:700;margin-top:3px;white-space:nowrap}
.chip.hot{background:#F2232A;border-color:#F2232A}
.chip.hot .k{color:rgba(255,255,255,.8)}
.chip:has(.v:empty){display:none}
.foot{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(0,0,0,.55);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 64px;gap:14px;font-size:16px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:#E4E4E8}
.foot .dot{width:8px;height:8px;border-radius:50%;background:#F2232A;box-shadow:0 0 12px #F2232A}
.foot .r{margin-left:auto;color:#fff;background:#F2232A;border-radius:999px;padding:7px 18px;letter-spacing:1.4px;font-size:14.5px}
</style></head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="ring"></div><div class="ring r2"></div>
<img class="mark" src="{{assets}}/kalvium-logo.png" alt="">
<div class="fade"></div>
<div class="col">
  <div class="brand"><img src="{{assets}}/kalvium-logo.png" alt="">Kalvium<span class="sep"></span><span class="c">Careers</span></div>
  <h1>{{headline}}</h1>
  <div class="sub">{{subhead}}</div>
  <div class="role">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>
  <div class="chips">
    <div class="chip"><div class="k">Location</div><div class="v">{{location}}</div></div>
    <div class="chip"><div class="k">Experience</div><div class="v">{{experience}}</div></div>
    <div class="chip hot"><div class="k">CTC</div><div class="v">{{ctc}}</div></div>
  </div>
</div>
<div class="foot"><span class="dot"></span>{{footer}}<span class="r">Apply now →</span></div>
</body></html>
